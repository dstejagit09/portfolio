<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Saiteja Dasari: robotics and signal integrity engineering portfolio.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Saiteja Dasari · Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: landing (name + two gradient-hero cards) -> portfolio split: headline column left, stacked card deck right. All card content is in normal flow (no absolute overlays). */
:root{
  --bg:#150909; --panel:#2d1013; --panel-top:#1f0b0d; --raise:#3a1719;
  --glow:radial-gradient(60% 55% at 35% 62%,rgba(184,145,90,.95),transparent 70%),radial-gradient(60% 65% at 76% 30%,rgba(150,54,42,.95),transparent 72%),linear-gradient(180deg,#0e0505,#1a0a0b 70%,#141010);
  --grain:radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.2px);
  --cream:#fcf6dc; --fg:#efe3dd; --text:#d8c4bd; --muted:#b59e98; --dim:#7d6662;
  --line:rgba(255,235,225,.12); --line2:rgba(255,235,225,.2);
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
body{background:radial-gradient(1100px 800px at 75% 20%,#2a0e10 0%,var(--bg) 62%) fixed var(--bg)}
body{min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--cream)}
.wrap{max-width:1240px;margin:0 auto}

/* mock bar */
.mockbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:14px 0;font-size:12px;color:var(--dim)}
.mockbar b{color:var(--muted);font-weight:500}
.mockbar .views{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.mockbar .views button{background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--muted)}
.mockbar .views button[aria-pressed=true]{background:var(--cream);color:#1a0b0b;border-color:var(--cream)}

/* shared top nav */
.topnav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px}
.home{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:0;font-size:14px;color:var(--fg)}
.home i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-style:normal;font-size:12px;letter-spacing:.06em;color:var(--cream)}
.navr{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:99px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--cream);color:#1a0b0b}
.li{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);font-size:13px;text-decoration:none;color:var(--fg)}
.li:hover{border-color:var(--cream)}
.li svg{width:15px;height:15px;fill:currentColor}

/* ===== landing ===== */
#landing .stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:clamp(40px,10vh,120px) 70px}
.name{margin:18px 0 0;font-size:clamp(40px,6.4vw,84px);line-height:1.05;font-weight:400;letter-spacing:-.03em;color:#f6e9ea}
.role{margin:18px 0 0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.rule{width:56px;height:1px;background:var(--line2);margin:30px 0 0}
.pick{margin:22px 0 0;font-size:16px;color:var(--muted)}
.choices{margin-top:34px;display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:24px;justify-content:center;width:100%}
.choice{text-align:left;border:1px solid var(--line2);border-radius:24px;background:var(--panel);padding:0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 70px -40px #000;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s}
.choice:hover{transform:translateY(-5px);border-color:rgba(252,246,220,.35)}
.chero{display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:230px;padding:20px 22px 22px;background:var(--grain),var(--glow);background-size:3px 3px,auto}
.chero .pill{background:rgba(0,0,0,.65)}
.chero .dot{background:#000;width:36px;height:36px}
.chero .ctitle .h{display:block;font-size:28px;font-weight:500;letter-spacing:-.01em;color:#fff}
.chero .ctitle .p{display:block;margin-top:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#e9d5c6}
.cfoot{padding:18px 22px 22px;display:flex}
.enter{flex:1;height:50px;border-radius:10px;background:var(--cream);color:#1a0b0b;display:grid;place-items:center;font-size:15px;transition:filter .2s}
.choice:hover .enter{filter:brightness(1.04)}

/* ===== portfolio ===== */
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:start;padding-block:clamp(10px,3vh,30px) 50px}
.left{display:flex;flex-direction:column;min-height:640px;min-width:0}
.big{margin:30px 0 0;font-weight:400;letter-spacing:-.035em;line-height:1;font-size:clamp(52px,6.2vw,92px);color:#f6e9ea;overflow-wrap:anywhere}
.big em{display:block;font-style:italic;color:var(--cream);padding-bottom:.08em}
.lede{margin:24px 0 0;font-size:clamp(16px,1.4vw,19px);line-height:1.65;color:var(--muted);max-width:34ch}
.counter{margin-top:auto;border-top:1px solid var(--line);padding-top:34px}
.counter .n{font-size:clamp(52px,5vw,72px);letter-spacing:-.03em;color:#f6e9ea;font-variant-numeric:tabular-nums}
.counter .of{font-size:22px;color:var(--dim);margin-left:10px}
.bar{margin-top:24px;height:2px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cream);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.ctrls{display:flex;gap:10px;align-items:center;margin-top:20px}
.ctrls button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:transparent}
.ctrls button:disabled{opacity:.35;cursor:default}
.ctrls span{font-size:12px;color:var(--dim);margin-left:6px}
.fade{transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.2,1)}
.fade.out{opacity:0;transform:translateY(8px)}

.deck{position:relative;padding:0 28px 36px 0;min-width:0}
.ghost{position:absolute;inset:0 28px 36px 0;border-radius:28px;border:1px solid var(--line);background:var(--panel-top)}
.ghost.g1{transform:translate(14px,18px);opacity:.75}
.ghost.g2{transform:translate(28px,36px);opacity:.4}
.card{position:relative;border-radius:28px;border:1px solid var(--line2);background:var(--panel);min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.chead{background:var(--panel-top);border-bottom:1px solid var(--line);padding:28px 32px 30px;display:flex;flex-direction:column;gap:26px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{font-size:12px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line2);color:var(--cream);padding:8px 14px;border-radius:99px}
.dot{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--cream);font-size:12px}
.ctitle h3{margin:0;font-size:clamp(28px,3vw,40px);font-weight:500;letter-spacing:-.02em;color:#fff;line-height:1.15}
.ctitle p{margin:10px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cbody{padding:26px 32px 30px;display:flex;flex-direction:column;gap:18px;flex:1;min-width:0}
.cbody h4{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--cream)}
.cbody p{margin:0;font-size:16px;line-height:1.7;color:var(--text);max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;border:1px solid var(--line);background:rgba(0,0,0,.18);padding:5px 11px;border-radius:6px;color:var(--text)}
.btns{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns button{height:52px;border-radius:10px;font-size:16px;border:1px solid var(--line2);background:var(--raise);color:#f6e9ea}
.btns button.pri{background:var(--cream);color:#1a0b0b;border-color:var(--cream)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--panel);padding:12px 14px}
.facts dt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:4px 0 0;font-size:14px;color:var(--fg)}

/* list rows (projects / experience / certs) */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
button.row:hover,a.row:hover{background:rgba(255,255,255,.025)}
a.row{text-decoration:none;color:inherit}
a.row:hover .arr{transform:translateX(4px);color:var(--cream)}
button.row:hover .arr{transform:translateX(4px);color:var(--cream)}
.row .num{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.row .t{font-size:17px;color:#f3e6e2;font-weight:500;line-height:1.35}
.row .s{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.5}
.row .arr{font-size:16px;color:var(--muted);transition:transform .25s,color .25s}
.row .meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.hint2{font-size:12px;color:var(--dim)}

/* skills grid */
.edu{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ed{padding:20px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.edh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.ed .t{font-size:17px;color:#f3e6e2;font-weight:500;line-height:1.35}
.ed .s{margin-top:4px;font-size:13px;color:var(--muted)}
.ed .meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap;padding-top:4px}
.cw{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.tags .tph{border-style:dashed;border-color:var(--line2);background:transparent;color:var(--dim)}
.cbody p,.row .s,.ed .s,.info p{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;max-width:none}
.skills{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.sk{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.sk b{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:500;padding-top:6px}

/* Robotics view fills the whole screen below the top bar, edge to edge, like the SI view */
#robo{position:fixed;left:0;right:0;bottom:0;top:var(--robo-top,140px);z-index:5;background:var(--bg)}
#robo iframe{display:block;width:100%;height:100%;border:0;background:transparent}
body.rob-open{overflow:hidden;background:#1a0708}
/* Signal Integrity scrolls in the same place as Robotics: a pane below the top bar, so both views
   have an identical scrollbar (same position, same colours) */
body.port-open{overflow:hidden}
#si{position:fixed;left:0;right:0;bottom:0;top:var(--robo-top,140px);z-index:5;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
#si > .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html,#si{scrollbar-color:rgba(253,250,216,.28) #120607}
.robonote{margin:0 0 6px;border:1px dashed var(--line2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
/* robotics stand-in keeps the existing gradient look, untouched */
.rhero{position:relative;padding:28px 32px 30px;min-height:400px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;
  background:var(--grain),var(--glow);background-size:3px 3px,auto}
.rhero .pill{background:rgba(0,0,0,.65)}.rhero .dot{background:#000}
.rmid h3{margin:0;font-size:clamp(30px,3.2vw,44px);font-weight:500;letter-spacing:-.02em;color:#fff;line-height:1.15}
.rmid hr{width:52px;border:0;border-top:1px solid rgba(255,255,255,.35);margin:20px 0 0}
.rhero b{display:block;font-size:clamp(32px,3.6vw,48px);font-weight:500;letter-spacing:-.02em;color:#fff;line-height:1.1}
.rhero small{display:block;margin-top:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#e9d5c6}
.card{min-height:780px}
.cbody{background:var(--panel)}

/* ===== project modal ===== */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,3,3,.72);backdrop-filter:blur(6px);display:grid;place-items:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(980px,100%);max-height:100%;overflow:auto;border-radius:24px;border:1px solid var(--line2);background:var(--panel);display:flex;flex-direction:column;animation:pop .35s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.mhead{display:flex;align-items:center;gap:14px;padding:22px 24px;border-bottom:1px solid var(--line);background:var(--grain),var(--glow);background-size:3px 3px,auto}
.mhead .pill{background:rgba(0,0,0,.65)}.mhead .x{background:#000}
.mhead h3{margin:0;font-size:20px;font-weight:500;color:#fff;flex:1;min-width:0}
.mhead .pill{font-size:11px;padding:6px 11px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;font-size:15px;flex:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;min-height:380px}
.shot{border-right:1px solid var(--line);padding:24px;display:flex}
.shot .ph{flex:1;border:1px dashed var(--line2);border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--dim);font-size:13px;line-height:1.6;padding:20px;min-height:280px}
.info{padding:24px 26px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.info h4{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);font-weight:600}
.info p{margin:0;font-size:13.5px;line-height:1.6;color:var(--text)}
.info{gap:12px}
.blank{display:flex;flex-direction:column;gap:9px}
.blank i{display:block;height:10px;border-radius:5px;background:rgba(255,255,255,.06)}


/* ===== Signal Integrity cards sized exactly like the Robotics cards: 380px cover + 560px deck, 3:4.4 card, 50/50 split ===== */
.split{grid-template-columns:380px 560px;justify-content:center;gap:64px;padding-block:8px 70px}
.left{min-height:620px;padding-block:32px}
.eyebrow{font-size:12px;letter-spacing:.2em}
.big{font-size:92px;line-height:.95;letter-spacing:-.03em;margin:20px 0 0;overflow-wrap:normal;word-break:normal}
.lede{font-size:16px;line-height:1.65;max-width:340px;margin:16px 0 0}
.counter{padding-top:24px}
.counter .n{font-size:48px;font-weight:500;letter-spacing:-.02em}
.counter .of{font-size:15px;letter-spacing:.1em}
.bar{margin-top:20px}
.deck{padding:0;width:100%;max-width:560px}
.ghost{inset:0;border-radius:20px;border:.5px solid var(--line2)}
.ghost.g1{transform:translate(30px,20px) scale(.94) rotate(3deg);opacity:.65}
.ghost.g2{transform:translate(60px,40px) scale(.88) rotate(6deg);opacity:.35}
.card{min-height:0;aspect-ratio:3/4.4;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.rhero{height:50%;min-height:0;flex:none;padding:18px 22px;gap:0}
.rhero .pill{font-size:10px;letter-spacing:.15em;padding:5px 10px}
.rhero .dot{width:30px;height:30px;font-size:13px}
.rmid h3{font-size:32px;line-height:1.2}
.rhero small{font-size:10px;letter-spacing:.1em;margin-top:6px}
.rhero > div:last-child small{font-size:11px;letter-spacing:.15em}
.rmid hr{width:32px;margin-top:14px}
.rhero b{font-size:31px;line-height:1}
.cbody{height:50%;flex:none;padding:20px 22px;gap:10px;overflow:hidden}
.cbody h4{font-size:12px;letter-spacing:.15em;font-weight:500}
.cbody p{font-size:13.5px;line-height:1.55}
.tags{gap:4px}
.tags span{font-size:11px;padding:2px 7px;border-radius:4px}
.btns{gap:6px}
.btns button,.btns a{height:auto;padding:9px 10px;font-size:12.5px;border-radius:7px}
.btns a{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line2);background:var(--raise);color:#f6e9ea}
.btns a.pri{background:var(--cream);color:#1a0b0b;border-color:var(--cream)}
.row{padding:10px 2px;gap:10px;grid-template-columns:26px minmax(0,1fr) auto}
.row .num{font-size:11px}
.row .t{font-size:14.5px}
.row .s{font-size:11.5px;margin-top:3px}
.row .meta{font-size:10px}
.hint2{font-size:10px;letter-spacing:.1em}
.ed{padding:11px 2px;gap:7px}
.ed .t{font-size:14.5px}
.ed .s{font-size:11.5px}
.ed .meta{font-size:10px}
.cw{font-size:10px}
.sk{grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0}
.sk b{font-size:10px;padding-top:3px}

/* SI section bar: same look as the Robotics section nav (frosted pill, numbered tabs, cream active) */
.snav{position:relative;display:flex;gap:4px;padding:5px;width:fit-content;max-width:100%;margin:6px auto 22px;
  background:rgba(253,250,216,.06);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  border:.5px solid rgba(253,250,216,.14);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.snav button{flex:1 1 0;display:flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 16px;border:0;border-radius:10px;background:transparent;
  color:#c2a59f;font-size:15px;font-weight:500;transition:all .2s cubic-bezier(.2,.7,.2,1)}
.snav button::before{content:attr(data-num);font-size:11px;font-weight:500;color:#8a6a65}
.snav button:hover{color:#f7ece8;background:rgba(255,255,255,.04)}
.snav button[aria-current=true]{color:#23090a;background:#fdfad8}
.snav button[aria-current=true]::before{color:rgba(35,9,10,.6)}
.snav{-webkit-backdrop-filter:none;backdrop-filter:none}   /* static bar: blur invisible here, and avoids Chrome repaint patches */
@media (max-width:1240px){.snav{overflow-x:auto;scrollbar-width:none}.snav::-webkit-scrollbar{display:none}.snav button{flex:0 0 auto}}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .left{min-height:0}
  .counter{margin-top:28px;padding-top:22px}
  .deck{padding:0}.ghost{display:none}
  .card{min-height:0}
}
@media (max-width:640px){
  .choices{grid-template-columns:minmax(0,1fr)}
  .chead,.cbody,.rhero{padding-left:20px;padding-right:20px}
  .btns{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .sk{grid-template-columns:1fr;gap:8px}.sk b{padding-top:0}
  .row{grid-template-columns:32px minmax(0,1fr) auto}
  .row .meta{display:none}
  .mgrid{grid-template-columns:1fr}.shot{border-right:0;border-bottom:1px solid var(--line)}
  .navr{margin-left:0;width:100%}
}

@media (max-width:1060px){
  .split{grid-template-columns:minmax(0,1fr);gap:32px}
  .left{min-height:0;padding:0}
  .big{font-size:56px}
  .deck{margin:0 auto}
  .ghost{display:none}
  .card{aspect-ratio:auto}

function viewFromURL(){
  const seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/")[0].toLowerCase();

function go(k){const want=k?PATHS[k]:"/";if(location.pathname!==want||location.hash)history.pushState(null,"",want);route()}

  $("L").classList.add("out");$("C").classList.add("out");setTimeout(apply,240);
}
/* One height for all 7 SI cards: the designed 3:4.4 card above phone width, grown if any card's full
   content needs more; hero band equal across cards. Measured off-screen in #Cm at the live card width. */
function sizeSI(){
  const deck=$("C").parentElement,M=$("Cm"),W=$("C").offsetWidth;if(!W)return;
  M.style.width=W+"px";
  const base=innerWidth>640?W*4.4/3:0;let hero=base/2,body=0;   // same 3:4.4 card as Robotics on tablets and up
  SI.forEach(s=>{M.innerHTML=s.card;hero=Math.max(hero,M.querySelector(".rhero").offsetHeight);body=Math.max(body,M.querySelector(".cbody").offsetHeight)});
  M.innerHTML="";
  deck.style.setProperty("--hero-h",Math.ceil(hero)+"px");
  deck.style.setProperty("--card-h",Math.ceil(Math.max(base,hero+body))+"px");
  deck.classList.add("sized");
}
function fitBig(){const el=$("Lt");el.style.fontSize="";let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&f>36){f-=2;el.style.fontSize=f+"px"}}
addEventListener("resize",()=>{if(cur&&cur!=="robotics"){fitBig();sizeSI()}});
if(document.fonts){const reSI=()=>{if(cur==="signal-integrity")sizeSI()};document.fonts.ready.then(reSI);document.fonts.addEventListener("loadingdone",reSI)}
function step(d){if(!cur||cur==="robotics"||!$("scrim").hidden)return;const n=idx+d;if(n<0||n>=DECKS[cur].length)return;idx=n;render()}
function openModal(i){
  const p=PROJECTS[i];lastFocus=document.activeElement;
  $("mnum").textContent="Project 0"+(i+1);$("mtitle").textContent=p.t;
  $("minfo").innerHTML=`<h4>Tools</h4><p>${p.s}</p><h4>What I did</h4>${p.d.map(x=>`<p>${x}</p>`).join("")}`;
  $("scrim").hidden=false;$("mclose").focus();
}
function closeModal(){if($("scrim").hidden)return;$("scrim").hidden=true;lastFocus&&lastFocus.focus&&lastFocus.focus()}
document.querySelector(".mhead").style.setProperty("--glow",glowVal(COLORS[2]));
$("snav").innerHTML=SI_NAV.map((t,i)=>`<button type="button" data-num="0${i+1}" data-sec="${i}">${t}</button>`).join("");
$("snav").addEventListener("click",e=>{const b=e.target.closest("[data-sec]");if(!b||cur!=="signal-integrity")return;const n=+b.dataset.sec;if(n!==idx){idx=n;render()}});
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("mclose").onclick=closeModal;
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
document.addEventListener("click",e=>{
  const pr=e.target.closest("[data-proj]");if(pr&&PROJECT_POPUPS){openModal(+pr.dataset.proj);return}
  const b=e.target.closest("[data-go]");if(!b)return;const g=b.dataset.go;
  go(g);
});
function placeRobo(){const nav=document.querySelector("#portfolio .topnav");if(!nav)return;document.documentElement.style.setProperty("--robo-top",Math.round(nav.getBoundingClientRect().bottom)+"px")}
addEventListener("resize",()=>{if(cur)placeRobo()});
addEventListener("hashchange",route);
addEventListener("popstate",route);
/* Clean paths: /robotics and /signal-integrity open those views; the old robotics deep links
   (/projects/<slug>, /build-log/<slug>, /about, /skills, /contact, /socials, /role-models) open Robotics at that spot. */
let ROB_PATH="",roboLoaded=false;
(function(){
  const seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/")[0].toLowerCase();
  const ROB_SECTIONS=["about","projects","build-log","skills","contact","socials","role-models"];
  if(ROB_SECTIONS.includes(seg)){ROB_PATH=location.pathname;history.replaceState(null,"","/robotics")}
})();
route();
</script>
